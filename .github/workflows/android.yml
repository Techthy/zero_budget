name: Android APK

# Pull requests are checked and built. Pushes to main also update the nightly
# pre-release, and version tags like v1.2.0 publish a stable release. Both
# are the same app, signed with the same key, so they update each other.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes older builds pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      # The widget tests can hang, so only the database tests run here.
      - run: flutter test test/database_test.dart

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pubspec.yaml."
            exit 1
          fi
          # Nightlies are named after the release they lead up to.
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            version="$version-nightly.$GITHUB_RUN_NUMBER"
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      # Secrets aren't available to pull requests from forks; their APKs are
      # signed with a debug key and never published.
      - name: Set up the release key
        id: signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::warning::No release key is set up, so this APK is signed with a debug key and won't be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/release.jks
          # A line break pasted along with a secret isn't part of it.
          export ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD%[$'\r\n']}"
          ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS%[$'\r\n']}"

          # Checked here for a clearer error than Gradle's, minutes later.
          if ! output=$(keytool -list -keystore android/app/release.jks \
              -storepass:env ANDROID_KEYSTORE_PASSWORD 2>&1); then
            echo "::error::ANDROID_KEYSTORE_PASSWORD doesn't open the key in ANDROID_KEYSTORE."
            echo "keytool says: $output"
            # Hints that give nothing away, as the logs can be public.
            echo "SHA-256 of the key file: $(sha256sum android/app/release.jks | cut -d' ' -f1)"
            echo "Compare it with: sha256sum ~/zero-budget-release.jks"
            if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
              echo "ANDROID_KEYSTORE_PASSWORD is empty: check the secret's name, and that it's a repository secret."
            fi
            if [[ "$ANDROID_KEYSTORE_PASSWORD" =~ ^[[:space:]]|[[:space:]]$ ]]; then
              echo "ANDROID_KEYSTORE_PASSWORD starts or ends with a space."
            fi
            if printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | LC_ALL=C grep -q '[^ -~]'; then
              echo "ANDROID_KEYSTORE_PASSWORD has characters other than plain ASCII, which key passwords can't have."
            fi
            exit 1
          fi
          if ! keytool -list -keystore android/app/release.jks \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS" > /dev/null; then
            echo "::error::The key has no alias named like ANDROID_KEY_ALIAS."
            exit 1
          fi

          # Keys made by keytool have a single password for the key file and
          # the key in it. Backslashes start escapes in .properties files.
          escape() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=release.jks"
            echo "storePassword=$(escape "$ANDROID_KEYSTORE_PASSWORD")"
            echo "keyAlias=$(escape "$ANDROID_KEY_ALIAS")"
            echo "keyPassword=$(escape "$ANDROID_KEYSTORE_PASSWORD")"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # The run number keeps version codes increasing across nightlies and
      # releases, so each APK installs as an update of the one before.
      - name: Build the APK
        run: >-
          flutter build apk --release
          --build-number=$GITHUB_RUN_NUMBER
          --build-name=${{ steps.version.outputs.name }}

      - name: Remove the release key
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: zero-budget-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  nightly:
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Replacing the nightly must not overlap with another run doing the same.
    concurrency:
      group: nightly-release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zero-budget-apk

      # The tag and file name stay the same, so links to the nightly keep
      # working; the title tells the builds apart.
      - name: Replace the nightly pre-release
        run: |
          mv app-release.apk zero-budget-nightly.apk
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly zero-budget-nightly.apk \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --notes "Version $VERSION, the newest build from \`${GITHUB_REF_NAME}\`, made from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). It may have bugs; for everyday use, the latest release is safer. It installs as an update of the app, keeping your data."

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require the release key
        if: needs.build.outputs.signed != 'true'
        run: |
          echo "::error::Releases must be signed with the release key. Add the ANDROID_KEYSTORE secrets, then run this workflow again."
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: zero-budget-apk

      - name: Publish the release
        run: |
          mv app-release.apk "zero-budget-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "zero-budget-$GITHUB_REF_NAME.apk" \
            --verify-tag \
            --latest \
            --title "Zero Budget $GITHUB_REF_NAME" \
            --generate-notes
